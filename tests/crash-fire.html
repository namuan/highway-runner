<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crash fire tests</title>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js" } }
  </script>
</head>
<body>
  <pre id="results">Running…</pre>
  <script type="module">
    import * as THREE from 'three';
    import { CrashFire } from '../modules/world/visual-effects/CrashFire.js';
    import { createWorldBasis } from '../modules/math/WorldBasis.js';

    const results = document.getElementById('results');
    const messages = [];
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
      messages.push(`PASS ${message}`);
    };

    try {
      const basis = createWorldBasis({ right: '+z', up: '+y', forward: '+x' });
      const car = { mesh: new THREE.Group(), length: 4, width: 1.8 };
      car.mesh.position.set(100, 0.1, 3);
      car.mesh.rotation.y = Math.PI / 2;
      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(320, 240);
      const camera = new THREE.PerspectiveCamera(50, 4 / 3, 0.1, 100);
      camera.position.set(106, 5, 8);
      camera.lookAt(car.mesh.position);
      let shaderErrors = 0;
      renderer.debug.onShaderError = () => shaderErrors++;

      for (const mobile of [false, true]) {
        const fire = new CrashFire(car, basis, { mobile });
        scene.add(fire);
        assert(fire.batches.reduce((total, mesh) => total + mesh.geometry.instanceCount, 0) === (mobile ? 21 : 36), `bounded particle pool (${mobile ? 'mobile' : 'desktop'})`);
        const emitter = fire.position.clone().add(fire.emitter);
        const hood = car.mesh.localToWorld(new THREE.Vector3(0, 0.65, 1.28));
        assert(emitter.distanceTo(hood) < 1e-8, 'emitter follows vehicle orientation');
        const materials = fire.batches.map(mesh => mesh.material);
        const geometries = fire.batches.map(mesh => mesh.geometry);
        for (let frame = 0; frame < 1200; frame++) fire.update(1 / 60);
        assert(fire.batches.every((mesh, index) => mesh.material === materials[index] && mesh.geometry === geometries[index]), 'particles reuse GPU resources over 20 seconds');
        assert(geometries.every(geometry => ['origin', 'velocity', 'timing'].every(name => geometry.attributes[name].version === 0 && geometry.attributes[name].array.every(Number.isFinite))), 'animation needs no per-frame particle buffer uploads');
        renderer.render(scene, camera);
        assert(shaderErrors === 0, 'all effect shaders compile');
        assert(renderer.info.render.calls === 3, 'fire uses only three draw calls');
        let disposed = 0;
        geometries.forEach(geometry => geometry.addEventListener('dispose', () => disposed++));
        materials.forEach(material => material.addEventListener('dispose', () => disposed++));
        fire.dispose();
        assert(disposed === 6, 'all batch geometries and materials are disposed');
        assert(fire.parent === null && fire.children.length === 0 && fire.batches.length === 0, 'disposal clears scene and batch references');
      }

      const slow = new CrashFire(car, basis);
      const fast = new CrashFire(car, basis);
      for (let frame = 0; frame < 30; frame++) slow.update(1 / 30);
      for (let frame = 0; frame < 120; frame++) fast.update(1 / 120);
      assert(Math.abs(slow.time.value - fast.time.value) < 1e-8, 'animation clock is frame-rate independent');
      assert(Math.abs(slow.light.intensity - fast.light.intensity) < 1e-8, 'light flicker is frame-rate independent');
      slow.dispose();
      fast.dispose();
      renderer.dispose();
      results.textContent = messages.join('\n');
      document.body.dataset.status = 'passed';
    } catch (error) {
      results.textContent = [...messages, `FAIL ${error.message}`].join('\n');
      document.body.dataset.status = 'failed';
      throw error;
    }
  </script>
</body>
</html>
